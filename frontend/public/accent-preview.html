<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Accent Options Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#050608; font-family:'Inter',sans-serif; padding:28px; color:#fff; }
  h1.page { font-family:'Plus Jakarta Sans'; font-size:18px; font-weight:600; margin-bottom:6px; }
  p.sub { color:#71717A; font-size:13px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  .card { background:#0B0C0E; border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:22px 22px 24px; position:relative; overflow:hidden; }
  .label { font-size:11px; text-transform:uppercase; letter-spacing:.15em; color:#9BA1A6; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .swatch { width:12px; height:12px; border-radius:50%; }
  .pill { display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,0.10); border-radius:999px; padding:5px 10px; margin-bottom:14px; font-size:9px; text-transform:uppercase; letter-spacing:.14em; color:#c7cace; }
  .stars { letter-spacing:1px; font-size:9px; }
  h2 { font-family:'Plus Jakarta Sans'; font-weight:600; font-size:26px; line-height:1.1; letter-spacing:-.02em; color:#F7F8F9; margin-bottom:12px; }
  h2 .accent { font-family:'Playfair Display'; font-style:italic; font-weight:400; }
  .metrics { display:flex; gap:18px; margin:14px 0 16px; }
  .metric { padding-left:10px; }
  .metric .v { font-size:16px; font-weight:300; }
  .metric .l { font-size:8px; text-transform:uppercase; letter-spacing:.14em; color:#71717A; margin-top:3px; }
  .btns { display:flex; gap:10px; }
  .btn-primary { background:#fff; color:#000; font-size:11px; font-weight:600; padding:9px 16px; border-radius:6px; }
  .btn-ghost { border:1px solid rgba(255,255,255,0.22); color:#fff; font-size:11px; font-weight:600; padding:9px 16px; border-radius:6px; }
  .nav { display:flex; gap:14px; margin-bottom:16px; font-size:10px; color:#9BA1A6; }
  .nav .active { color:#fff; position:relative; }
  .nav .active:after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px; }
</style>
</head>
<body>
  <h1 class="page">Accent options on the dark theme — Qloud Tech hero</h1>
  <p class="sub">Same layout, five accent colours. Pick a letter and I'll apply it to the whole site.</p>
  <div class="grid" id="grid"></div>
<script>
  const opts = [
    { k:'a', name:'Monochrome / Platinum', c:'#E5E7EB' },
    { k:'b', name:'Warm Amber / Brass',    c:'#E8A13A' },
    { k:'c', name:'Electric Ice-Blue',     c:'#4EA8DE' },
    { k:'d', name:'Emerald / Jade',        c:'#2FBF9E' },
    { k:'e', name:'Copper / Terracotta',   c:'#C57B4E' },
  ];
  const tint = (hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;};
  document.getElementById('grid').innerHTML = opts.map(o=>`
    <div class="card">
      <div class="label"><span class="swatch" style="background:${o.c}"></span> Option ${o.k.toUpperCase()} · ${o.name}</div>
      <div class="nav"><span>Home</span><span class="active" style="">Services<span style="position:absolute;left:0;right:0;bottom:-4px;height:1px;background:${o.c}"></span></span><span>Packages</span><span>Contact</span></div>
      <div class="pill">Bangalore's #1 Specialists <span class="stars" style="color:${o.c}">★★★★★</span></div>
      <h2>Where Smart Living Meets <span class="accent" style="color:${o.c}">Cinematic Magic</span></h2>
      <div class="metrics">
        <div class="metric" style="border-left:2px solid ${o.c}"><div class="v">₹50K+</div><div class="l">Automation</div></div>
        <div class="metric" style="border-left:2px solid ${o.c}"><div class="v">₹3.5L+</div><div class="l">Theatre</div></div>
      </div>
      <div class="btns"><span class="btn-primary">View Packages</span><span class="btn-ghost" style="border-color:${tint(o.c,0.5)};color:${o.c}">Book Demo</span></div>
    </div>
  `).join('');
</script>
</body>
</html>
